name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not allow two deploys to race. Queue them — never cancel mid-deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          # `set -euo pipefail` is already inside deploy-pull.sh,
          # but `script_stop: true` makes the Action fail on any
          # non-zero exit on the remote side.
          script: |
            cd /srv/bullgram
            ./scripts/deploy-pull.sh

      # Волна 4.3: semver-тег на каждый успешный деплой (patch-bump) +
      # Release Notes git-cliff'ом. Пуш тега из GITHUB_TOKEN не триггерит
      # другие воркфлоу (антирекурсия GitHub), поэтому релиз создаётся здесь же.
      - name: Checkout for tagging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Tag release
        run: |
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
          else
            MAJOR="${LATEST#v}"; MAJOR="${MAJOR%%.*}"
            MINOR="${LATEST#v*.}"; MINOR="${MINOR%%.*}"
            PATCH="${LATEST##*.}"
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          git tag "$NEXT" "${{ github.sha }}"
          git push origin "$NEXT"
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          echo "tagged $NEXT on ${{ github.sha }}"

      - name: Release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          args: --latest --strip=all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: /tmp/release-notes.md
        run: |
          printf '%s' "${{ steps.cliff.outputs.content }}" > "$NOTES_FILE"
          gh release create "$NEXT" --title "$NEXT" --notes-file "$NOTES_FILE" --target "${{ github.sha }}"

      - name: External smoke check
        run: |
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://bullgram.xyz/ || echo "000")
          echo "https://bullgram.xyz/ → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "ERROR: site not responding"
            exit 1
          fi
