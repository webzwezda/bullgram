name: Release notes

# Волна 4.3: на пуш semver-тега — Release Notes из конвенционных коммитов
# (git-cliff) и GitHub Release. Ручного CHANGELOG нет (решение в.18).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          args: --latest --strip=all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}
          generate_release_notes: false
